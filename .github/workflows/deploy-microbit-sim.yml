name: Deploy microbit-sim

on:
  push:
    tags:
      - "microbit-sim-v*"

permissions:
  id-token: write
  contents: read

env:
  S3_BUCKET: microbit.mindcraft-lang.org
  AWS_REGION: us-east-1
  CLOUDFRONT_DISTRIBUTION_ID: E3MYKIZ1C0O435

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install microbit-sim dependencies
        working-directory: apps/microbit-sim
        run: |
          rm -f package-lock.json
          npm install

      # `npm run build` runs the prebuild step first: it installs the external
      # and local package dependencies and builds them (build:deps) before Vite.
      - name: Build microbit-sim
        working-directory: apps/microbit-sim
        run: npm run build

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync build output to S3
        run: |
          aws s3 sync apps/microbit-sim/dist "s3://$S3_BUCKET" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
